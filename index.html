<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Порталы — HTML5 playable</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140f20;font-family:system-ui,sans-serif;color:white}main{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(ellipse,#493345,#140f20)}canvas{display:block;touch-action:none}#hint{position:absolute;top:max(24px,env(safe-area-inset-top));text-align:center;pointer-events:none;text-shadow:0 2px 8px #000;font-size:clamp(16px,3vw,24px);font-weight:700}#status{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;color:#e6d6ff;text-shadow:0 2px 6px #000}#next{position:absolute;inset:0;background:radial-gradient(ellipse,#3a265c,#120d20);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}#next[hidden]{display:none}#next h1{font-size:36px;margin:0 0 12px}#next p{color:#d5c3ed}button{border:1px solid #d2afff;background:#674295;color:white;padding:14px 24px;border-radius:12px;font:inherit;cursor:pointer}#controls{position:absolute;inset:0;pointer-events:none}.portal-key{position:absolute;background:transparent;border:0;padding:0;pointer-events:auto;border-radius:50%;color:transparent}.portal-key:focus-visible{outline:3px solid #fff}.portal-key:disabled{pointer-events:none}
@media (orientation:landscape){#hint{left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));font-size:16px}}
</style>
<main><canvas aria-label="Персонаж перед тремя порталами"></canvas><div id="controls"></div><div id="hint">Выберите портал</div><div id="status" role="status">Загрузка…</div><section id="next" hidden><h1>Сцена 2</h1><p>Переход выполнен. Продолжение скоро.</p><button id="restart">Вернуться к порталам</button></section></main>
<script src="assets-manifest.js"></script>
<script>
'use strict';
const EMBEDDED = null;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const status=document.querySelector('#status'),hint=document.querySelector('#hint'),next=document.querySelector('#next');
const portals=[{x:260,y:460,w:270,file:'port1_red.png'},{x:627,y:430,w:285,file:'port2.png'},{x:994,y:460,w:270,file:'port3_red.png'}];
const images=new Map(),buttons=[];let state='loading',clock=0,last=0,runStart=0,shake=[-99,-99,-99],scale=1;
const paths=['assets/scene1/scene1_back.png',...portals.map(p=>'assets/scene1/'+p.file),...Array.from({length:42},(_,i)=>`assets/char/i_s_u/${i}.png`),...Array.from({length:16},(_,i)=>`assets/char/m_s_u/${i}.png`)];
paths.push('assets/loot/sword.png','assets/scene2/scene2_back.png',...Object.entries(SEQUENCES).filter(([key])=>key.startsWith('assets/scene2/')||key.startsWith('assets/char_up/')||key.startsWith('assets/char/')).flatMap(([,frames])=>frames));
function load(path){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images.set(path,im);resolve()};im.onerror=()=>reject(new Error(path));im.src=EMBEDDED?.[path]||path})}
let width=0,height=0,characterSize=1;
function resize(){
 width=innerWidth;height=innerHeight;
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.style.width=width+'px';canvas.style.height=height+'px';
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 ctx.setTransform(canvas.width/width,0,0,canvas.height/height,0,0);
 const landscape=width>height;
 const portalWidth=Math.min(width*.27,height*(landscape?.30:.22));
 characterSize=Math.min(width*.19,height*.16)/37;
 portals.forEach((p,i)=>{
  p.w=portalWidth*(i===1?1.055:1);
  p.x=width*(landscape?[.27,.5,.73][i]:[.17,.5,.83][i]);
  p.y=height*(landscape?.47:.43)+(i===1?-portalWidth*.05:0);
  Object.assign(buttons[i].style,{left:(p.x-p.w/2)+'px',top:(p.y-p.w)+'px',width:p.w+'px',height:p.w+'px'});
 });
}
function drawBackground(){
 const im=images.get(paths[0]),cover=Math.max(width/im.width,height/im.height);
 const w=im.width*cover,h=im.height*cover;
 ctx.drawImage(im,(width-w)/2,(height-h)/2,w,h);
}
function choose(i){if(state!=='idle')return;if(i!==1){shake[i]=clock;status.textContent='Этот портал закрыт';return}state='running';runStart=clock;status.textContent='Вперёд!';hint.textContent='';buttons.forEach(b=>b.disabled=true)}
portals.forEach((p,i)=>{const b=document.createElement('button');b.className='portal-key';b.setAttribute('aria-label',i===1?'Войти в центральный портал':`Закрытый портал ${i+1}`);b.disabled=true;b.addEventListener('click',()=>choose(i));document.querySelector('#controls').append(b);buttons.push(b)});
function drawTutorial(){
 if(state!=='idle')return;
 const p=portals[1],size=Math.min(p.w*.35,40,(p.y-p.w-20)/1.3),bounce=(Math.sin(clock*5)+1)*size*.09;
 const tip=p.y-p.w-8-bounce;
 ctx.save();ctx.translate(p.x,tip-size);
 ctx.scale(1+Math.sin(clock*5)*.045,1+Math.sin(clock*5)*.045);
 ctx.shadowColor='#ffd65c';ctx.shadowBlur=14;
 ctx.fillStyle='#ffe46b';ctx.strokeStyle='#6d3d13';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-size*.16,0);ctx.lineTo(size*.16,0);
 ctx.lineTo(size*.16,size*.53);ctx.lineTo(size*.43,size*.53);
 ctx.lineTo(0,size);ctx.lineTo(-size*.43,size*.53);
 ctx.lineTo(-size*.16,size*.53);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function drawCharacter(progress){const running=state==='running',count=running?16:42,folder=running?'m_s_u':'i_s_u';const index=Math.floor((running?clock-runStart:clock)*24)%count;const im=images.get(`assets/char/${folder}/${index}.png`);const size=characterSize*(1-progress*.35),start=height*.65,end=portals[1].y-portals[1].w*.18,feet=start+(end-start)*progress;ctx.save();ctx.globalAlpha=1-Math.max(0,(progress-.89)/.11);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(width/2,feet,size*9.5,size*2.8,0,0,Math.PI*2);ctx.fill();ctx.imageSmoothingEnabled=false;ctx.drawImage(im,width/2-im.width*size/2,feet-im.height*size,im.width*size,im.height*size);ctx.restore()}
function frame(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;if(!document.hidden)clock+=dt;ctx.clearRect(0,0,width,height);if(state==='idle'||state==='running'){drawBackground();let progress=state==='running'?Math.min((clock-runStart)/1.85,1):0;portals.forEach((p,i)=>{const im=images.get('assets/scene1/'+p.file),age=clock-shake[i],dx=age<.42?Math.sin(age*85)*p.w*.045*(1-age/.42):0;const selected=i===1&&state==='running';const boost=selected?1+.075*Math.min((clock-runStart)/.16,1):1;ctx.save();ctx.translate(p.x+dx,p.y-p.w/2);ctx.scale(boost,boost);if(selected){ctx.shadowColor='#d699ff';ctx.shadowBlur=p.w*.14;ctx.filter='brightness(1.22)'}ctx.drawImage(im,-p.w/2,-p.w/2,p.w,p.w);ctx.restore()});drawCharacter(progress);drawTutorial();if(state==='running'&&progress>.88){ctx.fillStyle=`rgba(231,208,255,${(progress-.88)/.12})`;ctx.fillRect(0,0,width,height)}if(progress===1){state='scene2';startForest();status.textContent='';window.dispatchEvent(new CustomEvent('playable:scenechange',{detail:{scene:2}}))}}if(state==='scene2')forestFrame(dt);requestAnimationFrame(frame)}
document.querySelector('#restart').onclick=()=>{state='idle';next.hidden=true;hint.textContent='Выберите портал';status.textContent='';shake=[-99,-99,-99];buttons.forEach(b=>b.disabled=false)};
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=0);resize();requestAnimationFrame(frame);
Promise.all(paths.map(load)).then(()=>{state='idle';status.textContent='';buttons.forEach(b=>b.disabled=false)}).catch(()=>{status.textContent='Не удалось загрузить изображения. Обновите страницу.'});
</script>
<script src="scene2.js"></script>
</html>
